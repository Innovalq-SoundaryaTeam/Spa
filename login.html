<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function () {
  try {
    if (localStorage.getItem("ssw_theme") === "dark") {
      document.documentElement.setAttribute("data-theme", "dark");
    }
    var dir = localStorage.getItem("ssw_dir");
    if (dir === "rtl") document.documentElement.setAttribute("dir", "rtl");
  } catch (e) {}
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Login | Serenity Spa & Wellness</title>
<meta name="description" content="Login or create an account to book treatments, manage your membership and view your history at Serenity Spa & Wellness.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-visual">
    <a href="index.html" class="brand"><span class="leaf">🌿</span> Serenity Spa</a>
    <div class="auth-quote">"The best part of my week is the hour I spend here — I always leave <span>lighter than I arrived.</span>"</div>
    <div style="font-size:0.85rem;color:rgba(255,255,255,0.7);">— Kavita Desai, Gold Member</div>
  </div>

  <div class="auth-form-side">
    <div class="auth-box">
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:18px;">
        <button class="theme-toggle on-surface" id="themeToggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">🌙</button>
        <button class="dir-toggle on-surface" id="dirToggle" type="button" aria-label="Toggle right-to-left layout" title="Toggle right-to-left layout">RTL</button>
      </div>
      <div class="auth-tabs">
        <div class="auth-tab active" data-tab="login">Login</div>
        <div class="auth-tab" data-tab="register">Register</div>
      </div>

      <div class="demo-hint">
        <b>Try the demo:</b> email <b>demo@serenityspa.com</b> &middot; password <b>demo123</b>
      </div>

      <!-- LOGIN PANEL -->
      <div class="auth-panel active" id="panel-login">
        <div id="loginMsg" class="form-msg"></div>
        <form id="loginForm">
          <div class="form-group">
            <label for="loginEmail">Email Address</label>
            <input type="email" id="loginEmail" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Login to My Account</button>
        </form>
        <p class="auth-foot-link">New here? <a href="#" data-switch="register">Create an account</a></p>
      </div>

      <!-- REGISTER PANEL -->
      <div class="auth-panel" id="panel-register">
        <div id="registerMsg" class="form-msg"></div>
        <form id="registerForm">
          <div class="form-group">
            <label for="regName">Full Name</label>
            <input type="text" id="regName" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="regEmail">Email Address</label>
            <input type="email" id="regEmail" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="regPhone">Phone Number</label>
            <input type="tel" id="regPhone" class="form-control" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="regPassword">Password</label>
              <input type="password" id="regPassword" class="form-control" required minlength="4">
            </div>
            <div class="form-group">
              <label for="regConfirm">Confirm Password</label>
              <input type="password" id="regConfirm" class="form-control" required minlength="4">
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Create My Account</button>
        </form>
        <p class="auth-foot-link">Already a member? <a href="#" data-switch="login">Login here</a></p>
      </div>

      <div class="auth-divider">or continue with</div>
      <div class="social-auth-row">
        <button type="button" class="btn-social" id="googleSignIn">
          <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.71v2.26h2.9c1.7-1.57 2.7-3.87 2.7-6.61z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.36 0-4.36-1.59-5.08-3.73H.9v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.92 10.69A5.4 5.4 0 0 1 3.64 9c0-.59.1-1.16.28-1.69V4.98H.9A9 9 0 0 0 0 9c0 1.45.35 2.83.9 4.02z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .9 4.98l3.02 2.33C4.64 5.17 6.64 3.58 9 3.58z"/></svg>
          Continue with Google
        </button>
        <button type="button" class="btn-social" id="appleSignIn">
          <svg width="16" height="16" viewBox="0 0 17 20"><path fill="currentColor" d="M14.1 10.6c0-1.6.75-2.8 2.25-3.7-.85-1.2-2.15-1.85-3.85-1.95-1.6-.1-3.2.9-4 .9-.85 0-2.25-.85-3.65-.85-2.65 0-5.35 2.15-5.35 6.3 0 1.35.25 2.75.75 4.15.65 1.85 3 6.35 5.45 6.25 1.3-.05 2.2-.9 3.85-.9 1.6 0 2.45.9 3.85.9 2.5-.05 4.6-4.15 5.25-6 -3.3-1.5-4.55-3.3-4.55-5.1zM11.2 3.5c.85-1 1.4-2.3 1.25-3.5-1.15.05-2.5.75-3.3 1.65-.7.8-1.35 2.1-1.15 3.35 1.25.1 2.4-.55 3.2-1.5z"/></svg>
          Continue with Apple
        </button>
      </div>

    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    redirectIfAuthed();

    const tabs = document.querySelectorAll(".auth-tab");
    const panels = document.querySelectorAll(".auth-panel");
    function switchTo(name) {
      tabs.forEach(t => t.classList.toggle("active", t.dataset.tab === name));
      panels.forEach(p => p.classList.toggle("active", p.id === "panel-" + name));
    }
    tabs.forEach(t => t.addEventListener("click", () => switchTo(t.dataset.tab)));
    document.querySelectorAll("[data-switch]").forEach(a => {
      a.addEventListener("click", (e) => { e.preventDefault(); switchTo(a.dataset.switch); });
    });

    // Preserve any deep-link params (#book=, #therapist=, #plan=) through to the
    // dashboard. This is a hash fragment, not a query string, because a query
    // string gets dropped by static file servers with "clean URLs" (e.g. `serve`)
    // when they redirect /login.html -> /login — a hash fragment is never sent
    // to the server, so it always survives.
    const params = window.location.hash;

    document.getElementById("googleSignIn").addEventListener("click", () => {
      socialLogin("google");
      window.location.href = "dashboard.html" + params;
    });
    document.getElementById("appleSignIn").addEventListener("click", () => {
      socialLogin("apple");
      window.location.href = "dashboard.html" + params;
    });

    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;
      const result = loginUser({ email, password });
      const msg = document.getElementById("loginMsg");
      if (result.ok) {
        window.location.href = "dashboard.html" + params;
      } else {
        msg.textContent = result.message;
        msg.className = "form-msg show error";
      }
    });

    document.getElementById("registerForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const name = document.getElementById("regName").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const phone = document.getElementById("regPhone").value.trim();
      const password = document.getElementById("regPassword").value;
      const confirm = document.getElementById("regConfirm").value;
      const msg = document.getElementById("registerMsg");

      if (password !== confirm) {
        msg.textContent = "Passwords do not match.";
        msg.className = "form-msg show error";
        return;
      }
      const result = registerUser({ name, email, phone, password });
      if (result.ok) {
        window.location.href = "dashboard.html" + params;
      } else {
        msg.textContent = result.message;
        msg.className = "form-msg show error";
      }
    });
  });
</script>
</body>
</html>
